version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 1
    reviewers:
      - "baej12"
    
    # Keep npm dependency updates in a single PR/branch so Dependabot updates the
    # existing MR instead of opening separate patch/minor/major branches that can
    # conflict with each other after one is merged.
    groups:
      dependency-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
    
    # Rebase stale PRs automatically
    rebase-strategy: "auto"
    
    pull-request-branch-name:
      separator: "/"
    
    # Configure commit message
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    reviewers:
      - "baej12"
    commit-message:
      prefix: "ci:"
      include: "scope"
